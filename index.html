<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Evacua — Fire Escape Plan Maker</title>
<meta name="description" content="Draw a clear, printable fire escape and evacuation plan for your office, childcare center, shop or clinic. No CAD skills needed." />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>

<div id="app">

  <!-- ───────────────────────── Top bar ───────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1.5" y="1.5" width="29" height="29" rx="8"/>
        <path class="brand-run" d="M13 8.5a2.1 2.1 0 1 0 0-.01zM11.2 24l2.6-6.2-2.1-1.6-1.5 3.4-2.4-1 2.4-5.2 4.6-1.9 3.3 1.6 3.1 3.6-2 1.7-2.4-2.6-1.6.8 3 3.5-1.2 5.9z"/>
      </svg>
      <div class="brand-text">
        <strong>Evacua</strong>
        <span>Fire escape plan maker</span>
      </div>
    </div>

    <div class="topbar-group">
      <button class="tb" data-act="new" title="Start a new plan (Ctrl+N)"><i data-ico="file"></i><span>New</span></button>
      <button class="tb" data-act="templates" title="Browse starter layouts"><i data-ico="grid"></i><span>Templates</span></button>
      <button class="tb" data-act="open" title="Open a saved .evac plan file (Ctrl+O)"><i data-ico="open"></i><span>Open</span></button>
      <button class="tb" data-act="save" title="Save plan to a file (Ctrl+S)"><i data-ico="save"></i><span>Save</span></button>
    </div>

    <div class="topbar-divider"></div>

    <div class="topbar-group">
      <button class="tb icon-only" data-act="undo" title="Undo (Ctrl+Z)"><i data-ico="undo"></i></button>
      <button class="tb icon-only" data-act="redo" title="Redo (Ctrl+Shift+Z)"><i data-ico="redo"></i></button>
    </div>

    <div class="topbar-divider"></div>

    <div class="topbar-group zoomgroup">
      <button class="tb icon-only" data-act="zoom-out" title="Zoom out (−)"><i data-ico="minus"></i></button>
      <button class="tb zoomlabel" data-act="zoom-fit" title="Fit plan to screen (0)"><span id="zoom-readout">100%</span></button>
      <button class="tb icon-only" data-act="zoom-in" title="Zoom in (+)"><i data-ico="plus"></i></button>
    </div>

    <div class="topbar-spacer"></div>

    <div class="topbar-group">
      <button class="tb" data-act="help" title="Keyboard shortcuts & tips"><i data-ico="help"></i><span>Help</span></button>
      <button class="tb primary" data-act="print" title="Print or save as PDF (Ctrl+P)"><i data-ico="print"></i><span>Print / PDF</span></button>
      <button class="tb primary" data-act="export" title="Export a PNG image"><i data-ico="image"></i><span>Export PNG</span></button>
    </div>
  </header>

  <!-- ───────────────────────── Body ───────────────────────── -->
  <div class="workspace">

    <!-- Tool rail -->
    <nav class="rail" id="rail" aria-label="Drawing tools"></nav>

    <!-- Contextual left panel -->
    <aside class="panel panel-left" id="left-panel">
      <div class="panel-head">
        <h2 id="left-panel-title">Symbols</h2>
        <button class="panel-collapse" data-act="toggle-left" title="Hide panel">&#8249;</button>
      </div>
      <div class="panel-body" id="left-panel-body"></div>
    </aside>

    <!-- Canvas -->
    <main class="stage-wrap" id="stage-wrap">
      <canvas id="stage"></canvas>

      <div class="stage-hint" id="stage-hint" hidden></div>

      <div class="stage-overlay-tl">
        <div class="chipbar">
          <label class="chip"><input type="checkbox" id="opt-grid" checked><span>Grid</span></label>
          <label class="chip"><input type="checkbox" id="opt-snap" checked><span>Snap</span></label>
          <label class="chip"><input type="checkbox" id="opt-dims" checked><span>Sizes</span></label>
        </div>
      </div>

      <div class="stage-overlay-br">
        <button class="round-btn" data-act="zoom-fit" title="Fit to screen"><i data-ico="fit"></i></button>
      </div>
    </main>

    <!-- Right panel -->
    <aside class="panel panel-right" id="right-panel">
      <div class="panel-tabs" role="tablist">
        <button class="ptab is-active" data-tab="props" role="tab">Selected</button>
        <button class="ptab" data-tab="plan" role="tab">Plan info</button>
        <button class="ptab" data-tab="check" role="tab">Safety check <span class="tab-badge" id="check-badge">0</span></button>
      </div>
      <div class="panel-body" id="right-panel-body"></div>
    </aside>
  </div>

  <!-- ───────────────────────── Status bar ───────────────────────── -->
  <footer class="statusbar">
    <span class="status-tip" id="status-tip">Pick a tool on the left to begin.</span>
    <span class="status-spacer"></span>
    <span class="status-cell" id="status-sel">Nothing selected</span>
    <span class="status-cell" id="status-coord">—</span>
    <span class="status-cell" id="status-scale">Scale 1&#8202;ft grid</span>
  </footer>
</div>

<!-- Modal host -->
<div class="modal-host" id="modal-host" hidden></div>

<!-- Toast host -->
<div class="toast-host" id="toast-host" aria-live="polite"></div>

<!-- Hidden file input for opening plans -->
<input type="file" id="file-input" accept=".evac,.json,application/json" hidden />

<script type="module" src="src/main.js"></script>
</body>
</html>
